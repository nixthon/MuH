name: MuH
options:
  bundleIdPrefix: com.herdr
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "15"

targets:
  MuH:
    type: application
    platform: macOS
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
    sources:
      - path: MuH
        excludes:
          - "**/*.md"
    info:
      path: MuH/Info.plist
      properties:
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleName: MuH
        CFBundleDisplayName: MuH
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        NSPrincipalClass: NSApplication
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        ITSAppUsesNonExemptEncryption: NO
        NSDocumentsFolderUsageDescription: "MuH needs access so terminal sessions can read and write files in your Documents folder."
        NSDesktopFolderUsageDescription: "MuH needs access so terminal sessions can read and write files on your Desktop."
        NSDownloadsFolderUsageDescription: "MuH needs access so terminal sessions can read and write files in your Downloads folder."
        NSRemovableVolumesUsageDescription: "MuH needs access so terminal sessions can read and write files on removable volumes."
        NSNetworkVolumesUsageDescription: "MuH needs access so terminal sessions can read and write files on mounted network volumes."
        NSMicrophoneUsageDescription: "MuH lets terminal sessions and the apps they launch use the microphone."
        NSCameraUsageDescription: "MuH lets terminal sessions and the apps they launch use the camera."
        NSAudioCaptureUsageDescription: "MuH lets terminal sessions and the apps they launch capture system audio."
        NSAppleEventsUsageDescription: "MuH lets terminal sessions and the apps they launch send automation events to other apps."
    postBuildScripts:
      - name: Copy ghostty resources
        script: |
          set -e
          SRC="${PROJECT_DIR}/Vendor/ghostty/share/ghostty"
          DST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/ghostty"
          if [ -d "$SRC" ]; then
            mkdir -p "$DST"
            rm -rf "$DST"
            cp -R "$SRC" "$DST"
          fi
          SCRIPT_SRC="${PROJECT_DIR}/Resources/scripts/setup-herdr.sh"
          SCRIPT_DST="${BUILT_PRODUCTS_DIR}/${CONTENTS_FOLDER_PATH}/Resources/setup-herdr.sh"
          if [ -f "$SCRIPT_SRC" ]; then
            cp "$SCRIPT_SRC" "$SCRIPT_DST"
            chmod +x "$SCRIPT_DST"
          fi
        basedOnDependencyAnalysis: false
    settings:
      base:
        PRODUCT_NAME: MuH
        PRODUCT_BUNDLE_IDENTIFIER: com.herdr.MuH
        INFOPLIST_FILE: MuH/Info.plist
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: MuH/MuH.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: MuH/Ghostty/ghostty-bridging-header.h
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Automatic
        HEADER_SEARCH_PATHS:
          - $(PROJECT_DIR)/Vendor/ghostty/include
        LIBRARY_SEARCH_PATHS:
          - $(PROJECT_DIR)/Vendor/ghostty/lib
        OTHER_LDFLAGS:
          - -lghostty
          - -lc++
          - -framework Metal
          - -framework MetalKit
          - -framework QuartzCore
          - -framework AppKit
          - -framework CoreText
          - -framework CoreGraphics
          - -framework Carbon
          - -framework IOKit
          - -framework Security
      configs:
        Debug:
          SWIFT_OPTIMIZATION_LEVEL: "-Onone"
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          SWIFT_OPTIMIZATION_LEVEL: "-O"
