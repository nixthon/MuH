id = "muh.status-title"
name = "MuH Status Title"
version = "0.1.1"
min_luvus_version = "0.8.3"
description = "Sync aggregated agent status indicators to outer terminal window title for MuH"
platforms = ["linux", "macos", "windows"]

[[startup]]
command = ["bash", "run.sh"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "run.sh"]

[[events]]
on = "pane.created"
command = ["bash", "run.sh"]

[[events]]
on = "pane.closed"
command = ["bash", "run.sh"]

[[events]]
on = "pane.moved"
command = ["bash", "run.sh"]

[[events]]
on = "pane.focused"
command = ["bash", "run.sh"]

[[events]]
on = "pane.renamed"
command = ["bash", "run.sh"]

[[events]]
on = "tab.created"
command = ["bash", "run.sh"]

[[events]]
on = "tab.closed"
command = ["bash", "run.sh"]

[[events]]
on = "tab.moved"
command = ["bash", "run.sh"]

[[events]]
on = "tab.renamed"
command = ["bash", "run.sh"]

[[events]]
on = "workspace.created"
command = ["bash", "run.sh"]

[[events]]
on = "workspace.closed"
command = ["bash", "run.sh"]

[[events]]
on = "workspace.moved"
command = ["bash", "run.sh"]

[[events]]
on = "session.created"
command = ["bash", "run.sh"]

[[events]]
on = "session.updated"
command = ["bash", "run.sh"]

[[actions]]
id = "sync"
title = "Sync status title"
contexts = ["workspace"]
command = ["bash", "run.sh"]
